# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >-
      Hỏi lại người dùng khi thiếu thông tin bắt buộc, hoặc xin xác nhận trước một hành động
      ghi/gửi ra ngoài. Dùng khi: thiếu account/handle, thiếu URL, thiếu từ khóa tìm kiếm, hoặc
      trước mọi yêu cầu gửi/đăng/publish (`send`, Telegram). KHÔNG dùng khi thông tin đã có trong
      hội thoại hoặc khi chỉ cần trả lời trực tiếp. LUÔN truyền `response_type` một cách tường minh,
      không dựa vào default.
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi ngắn, hỏi đúng một thông tin còn thiếu"}
        response_type:
          type: string
          enum: [text, yes_no, choice]
          default: "text"
          description: >-
            BẮT BUỘC truyền tường minh, quyết định theo thứ tự ưu tiên sau:
            (1) "yes_no" — nếu yêu cầu có hành động gửi/đăng/publish ra ngoài (`send`, Telegram):
            luôn hỏi xác nhận chính hành động đó, ví dụ "Bạn xác nhận đăng bản tin này lên Telegram?".
            Quy tắc này THẮNG mọi lý do khác; kể cả khi nội dung còn thiếu hoặc mơ hồ thì vẫn
            dùng "yes_no", TUYỆT ĐỐI không dùng "text" để hỏi "đăng nội dung gì?".
            (2) "choice" — khi người dùng chỉ cần chọn trong danh sách cố định truyền ở `options`.
            (3) "text" — chỉ cho yêu cầu CHỈ ĐỌC còn thiếu giá trị (handle, URL, từ khóa).
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn, chỉ dùng cùng response_type=choice"}
      required: [question, response_type]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: >-
      Tra cứu thông tin trên web. Dùng cho tin tức, sự kiện, thông tin chung. KHÔNG dùng khi
      người dùng đã đưa URL cụ thể (dùng `fetch`), và KHÔNG dùng cho bài đăng mạng xã hội
      (dùng `social_search` / `timeline`). KHÔNG dùng khi yêu cầu của lượt hiện tại là gửi/đăng/
      publish ra ngoài — lúc đó chỉ được gọi `clarify` hoặc `send`, không được tra cứu trước. Ý "tin tức / mới nhất / hôm nay / tuần này" phải được
      diễn đạt qua `topic` và `timeframe`, không nhét vào `query`.
    parameters:
      type: object
      properties:
        query:
          type: string
          default: ""
          description: >-
            CHỈ là chủ đề trần, ngắn nhất có thể — thường 1-3 từ, giữ nguyên tên riêng
            ("AI", "robotics", "OpenAI"). TUYỆT ĐỐI không thêm các từ bổ nghĩa như
            "news", "latest", "today", "tin tức", "mới nhất", "hôm nay", "tuần này":
            những ý đó đã nằm ở `topic` và `timeframe`, lặp lại sẽ làm hỏng kết quả search.
            Ví dụ: "Tin AI hôm nay" -> query="AI", topic="news", timeframe="day".
        topic: {type: string, enum: [general, news], default: "general", description: "Dùng \"news\" cho mọi yêu cầu về tin tức/thời sự; \"general\" cho tra cứu thông tin thường"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Suy ra từ câu hỏi: hôm nay/mới nhất -> day, tuần này -> week, tháng này -> month, năm nay -> year"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: >-
      Gửi text ra ngoài (Telegram channel). Đây là hành động KHÔNG THỂ HOÀN TÁC.
      CHỈ gọi khi người dùng đã xác nhận rõ ràng ở một lượt TRƯỚC ĐÓ (ví dụ "mình xác nhận",
      "confirm rồi", "gửi luôn đi"); khi đó gọi `send` ngay với `confirmed=true` và không hỏi lại.
      Nếu chưa có xác nhận thì TUYỆT ĐỐI không gọi tool này — gọi `clarify(response_type="yes_no")`
      trước. Không bao giờ gọi `send` để trả lời một câu hỏi thông thường.
    parameters:
      type: object
      properties:
        text:
          type: string
          default: ""
          description: >-
            Nội dung sẽ được gửi đi. KHÔNG cần nội dung đầy đủ mới được gọi tool này: nếu chưa có
            sẵn nội dung chi tiết, vẫn gọi `send` với một dòng tóm tắt ngắn dựa trên yêu cầu của
            người dùng (ví dụ "Bản tin AI hôm nay"). TUYỆT ĐỐI không gọi `lookup`/`social_search`/
            `timeline` để soạn nội dung trước khi gửi — người dùng đã xác nhận là gửi ngay.
        confirmed:
          type: boolean
          default: false
          description: >-
            Phải là true thì tool mới thực sự gửi. Chỉ đặt true khi người dùng đã xác nhận
            tường minh ở lượt trước, không bao giờ tự đặt true để bỏ qua bước xác nhận.
      required: [text, confirmed]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
